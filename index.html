<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AAF Studio | Ahmed Assem El Fakharany, Full Stack Developer & AI Automation</title>
    <meta
      name="description"
      content="Portfolio of Ahmed Assem El Fakharany (AAF Studio): React & TypeScript web apps, landing pages, RAG chatbots and n8n AI automation."
    />
    <meta name="author" content="Ahmed Assem El Fakharany" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AAF Studio | Ahmed Assem El Fakharany" />
    <meta
      property="og:description"
      content="Web products and the AI automations that run behind them. React, TypeScript, Node, Python and n8n."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Set the theme before first paint: saved choice first, then the system preference.
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('aaf-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
